<style>

<body>
<header>
  <div class="brand">さんぽんパーソナル</div>
  <div class="sub">セッションのご予約</div>
</header>

<main id="app">
  <div class="spinner"></div>
</main>

<div class="bar" id="bar">
  <div class="inner">
    <div class="sel" id="selText"></div>
    <button class="btn" id="reqBtn">この日時で仮予約する</button>
  </div>
</div>

<script>
  const TOKEN = new URLSearchParams(location.search).get('t') || '';
  const DAYS_PER_PAGE = 10;
  let view = null, gymId = null, slots = [], shown = DAYS_PER_PAGE, picked = null, busy = false;

  let slotsByGym = {}, slotsAllP = null; // ページを開いた瞬間に全ジムの空き枠を裏で取りにいく
  let groups = [], groupKey = null; // 「南青山 / 六本木」のように複数ジムを1つのボタンにまとめたもの
  // ジム一覧 → ボタン一覧（まとめボタンが同じジムは1つにまとめる。並びは最初のジムの位置）
  function buildGroups(gyms) {
    const out = [], byKey = {};
    gyms.forEach((g) => {
      const key = g.group ? 'grp:' + g.group : g.id;
      if (!byKey[key]) { byKey[key] = { key, label: g.group || g.name, gyms: [] }; out.push(byKey[key]); }
      byKey[key].gyms.push(g);
    });
    out.forEach((x) => { if (x.gyms.length === 1) x.label = x.gyms[0].name; });
    return out;
  }
  const curGroup = () => groups.find((x) => x.key === groupKey);
  const gymName = (id) => { const g = view.gyms.find((x) => x.id === id); return g ? g.name : ''; };
  // お客さんごとの「優先ジム」（設定がある人だけ、空いていれば最初から選んでおき、空き時間に印をつける）
  const prefId = () => { const g = view && view.gyms.find((x) => x.preferred); return g ? g.id : ''; };
  const hasPref = (t) => !!prefId() && (t.gyms || []).indexOf(prefId()) >= 0;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const API_URL = "https://script.google.com/macros/s/AKfycbyn8BzGeSM6x5tSeIhi0vAlIhX7n8NpY-u_GSXo5exqINmJa_U9Nwe08gIJjlUDPg-M/exec";
  // 通信が一瞬こけても自動でやり直す（最大3回）。申請など書き込み系は二重登録を避けるため1回だけ
  const READ_ONLY = { apiCustomerView: 1, apiSlots: 1, apiSlotsAll: 1, apiAdminView: 1 };
  const call = async (fn, ...args) => {
    const tries = READ_ONLY[fn] ? 4 : 1;
    let lastErr = null;
    for (let i = 0; i < tries; i++) {
      if (i) await new Promise((r) => setTimeout(r, 1200 * i));
      let r, j;
      // 読み込み系は30秒で見切ってやり直す（Google側でたまに返事が詰まるため）
      const ac = (READ_ONLY[fn] && window.AbortController) ? new AbortController() : null;
      const timer = ac ? setTimeout(() => ac.abort(), 30000) : null;
      try {
        r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }), redirect: 'follow', credentials: 'omit', cache: 'no-store', signal: ac ? ac.signal : undefined });
        j = await r.json().catch(() => null);
      } catch (e) { lastErr = e; continue; } finally { if (timer) clearTimeout(timer); }
      if (!j) { lastErr = new Error('bad response ' + r.status); continue; }
      if (!j.ok) throw j.error;
      return j.result;
    }
    try { console.warn('call failed', fn, lastErr); } catch (e) {}
    // 申請などは、送れていても返事だけ受け取れなかった可能性がある（二重申請を防ぐため、確認をお願いする）
    if (!READ_ONLY[fn]) throw '送信結果を確認できませんでした。ページを再読み込みして「予約状況」に入っているか確認してください（入っていなければ、もう一度お試しください）。';
    throw '通信できませんでした（' + String(lastErr && lastErr.message || lastErr).slice(0, 60) + '）。ページを再読み込みしてもう一度お試しください。';
  };

  async function load(pre) {
    $('app').innerHTML = '<div class="spinner"></div>';
    hideBar();
    if (!pre || !pre.viewP) {
      slotsByGym = {};
      // 予約状況と空き枠を同時に取りにいく（順番に待つと遅いので）
      slotsAllP = call('apiSlotsAll', TOKEN).then((m) => { slotsByGym = m || {}; return slotsByGym; }).catch(() => null);
    }
    try {
      // 予約直後は、完了画面を見ている間に裏で取っておいた予約状況を使う（待ち時間なしで戻れる）
      view = await ((pre && pre.viewP) ? pre.viewP.catch(() => call('apiCustomerView', TOKEN)) : call('apiCustomerView', TOKEN));
      // 日時を先に選び、そのあと「その時間に空いている場所」から選ぶ（全部の場所をまとめて表示）
      groups = view.gyms.length ? [{ key: 'all', label: '', gyms: view.gyms }] : [];
      groupKey = groups.length ? 'all' : null;
      gymId = null;
      slots = []; shown = DAYS_PER_PAGE;
      render();
      if (groupKey && view.bookable > 0) loadSlots();
    } catch (e) {
      $('app').innerHTML = '<div class="err">' + esc(e) + '</div>';
    }
  }

  function render() {
    const v = view;
    let h = '';
    h += '<div class="hello">' + esc(v.name) + 'さん、こんにちは</div>';
    h += '<div class="card"><div class="muted">今から予約できる回数</div>';
    h += '<div class="count"><span class="num">' + v.bookable + '</span><span class="unit">回</span></div>';
    h += '<div class="muted">回数券の残り ' + v.remaining + '回／承認待ち ' + v.pending + '件</div></div>';

    h += '<h2>予約状況</h2><div class="card bkl">';
    if (!v.bookings.length) h += '<div class="muted">現在、予約はありません。</div>';
    else {
      h += '<table class="bkt"><thead><tr><th>日時</th><th>場所</th><th>状態</th></tr></thead><tbody>';
      v.bookings.forEach((b) => {
        const ok = b.status === '確定';
        h += '<tr><td class="d">' + esc(b.date) + '<div class="t">' + esc(b.time) + '</div></td><td class="g">' + esc(b.gym) + '</td>' +
          '<td><span class="pill ' + (ok ? 'ok' : 'wait') + '">' + (ok ? '確定' : '承認待ち') + '</span></td></tr>';
      });
      h += '</tbody></table>';
    }
    h += '</div>';

    h += '<h2>新しく予約する</h2>';
    if (v.bookable <= 0) {
      const reason = v.remaining - v.pending <= 0
        ? '予約できる回数が残っていません。続けてのご利用はトレーナーにご相談ください。'
        : '承認待ちの仮予約が上限（' + v.maxPending + '件）に達しています。確定のご連絡をお待ちください。';
      h += '<div class="note">' + reason + '</div>';
    } else if (!v.gyms.length) {
      h += '<div class="note">ご利用できるジムが設定されていません。トレーナーにお問い合わせください。</div>';
    } else {
      h += '<div class="muted" style="margin-bottom:8px">日時を選んでください。場所はそのあとに選べます（' + v.leadDays + '日後以降' + (v.until ? '、' + esc(v.until) + 'まで' : '') + 'の枠から選べます）' + (v.sessionMin > 60 ? '<br>1回' + (v.sessionMin % 60 ? v.sessionMin + '分' : (v.sessionMin / 60) + '時間') + 'のセッションです。' : '') + '</div>';
      h += '<div id="slots"></div>';
    }
    h += '<div class="trainer"><img src="trainer.jpg" alt="トレーナー さんぽん" width="64" height="64" loading="lazy">' +
      '<div class="t-msg">ご予約ありがとうございます！当日お会いできるのを楽しみにしています。キャンセル・日時の変更は、Slackで気軽にご連絡ください。<br>さんぽん</div></div>';
    $('app').innerHTML = h;

    document.querySelectorAll('[data-gym]').forEach((el) => el.addEventListener('click', () => {
      groupKey = el.getAttribute('data-gym'); gymId = null;
      document.querySelectorAll('[data-gym]').forEach((x) => x.classList.toggle('on', x === el));
      picked = null; hideBar(); shown = DAYS_PER_PAGE; dayIdx = 0;
      loadSlots();
    }));
  }

  async function loadSlots() {
    const box = $('slots');
    if (!box) return;
    box.innerHTML = '<div class="spinner"></div>';
    const requested = groupKey;
    const grp = curGroup();
    try {
      if (!grp) return;
      const ids = grp.gyms.map((g) => g.id);
      if (ids.some((id) => !slotsByGym[id]) && slotsAllP) await slotsAllP;
      for (const id of ids) if (!slotsByGym[id]) slotsByGym[id] = await call('apiSlots', TOKEN, id);
      if (requested !== groupKey) return; // 途中でボタンを切り替えた
      slots = mergeSlots(ids.map((id) => [id, slotsByGym[id] || []]));
      renderSlots();
    } catch (e) {
      box.innerHTML = '<div class="err">' + esc(e) + '</div>';
    }
  }

  let dayIdx = 0;

  // 時間帯のしぼり込み（朝・昼・夜）。チェックを外した時間帯の枠は日付の件数から外す
  const BANDS = [['am', '朝', '〜12時', 0, 12], ['noon', '昼', '12〜17時', 12, 17], ['pm', '夜', '17時〜', 17, 24]];
  let bandOn = { am: true, noon: true, pm: true };
  try { const sv = JSON.parse(localStorage.getItem('sanpon_bands') || 'null'); if (sv && (sv.am || sv.noon || sv.pm)) bandOn = sv; } catch (e) {}
  const hourOf = (t) => Number(t.label.split(':')[0]);
  const inBands = (t) => BANDS.some(([k, , , f, to]) => bandOn[k] && hourOf(t) >= f && hourOf(t) < to);

  function renderSlots() {
    const box = $('slots');
    if (!slots.length) { box.innerHTML = '<div class="note" style="margin-top:16px">予約できる枠が今はありません。トレーナーにご相談ください。</div>'; return; }
    // しぼり込み後の日付一覧（選んでいた日はなるべく保つ）
    const curLabel = window.__dayLabel;
    const vs = slots.map((d) => ({ label: d.label, times: d.times.filter(inBands) })).filter((d) => d.times.length);
    let h = '<div class="bandf">' + BANDS.map(([k, n, r]) =>
      '<button class="bf' + (bandOn[k] ? ' on' : '') + '" data-band="' + k + '"><span class="box">' + (bandOn[k] ? '✓' : '') + '</span>' + n + '<small>' + r + '</small></button>').join('') + '</div>';
    if (!vs.length) {
      box.innerHTML = h + '<div class="note" style="margin-top:16px">選んだ時間帯に空きがありません。チェックを増やしてみてください。</div>';
      bindBands(box); return;
    }
    const keep = vs.findIndex((d) => d.label === curLabel);
    if (keep >= 0) dayIdx = keep; else if (dayIdx >= vs.length) dayIdx = 0;
    window.__dayLabel = vs[dayIdx].label;
    // ① 日付を横スクロールで選ぶ
    h += '<div class="dates" id="dates">';
    vs.forEach((d, i) => {
      const m = d.label.match(/^(\d+\/\d+)（(.)）/) || [];
      const cls = m[2] === '土' ? ' sat' : m[2] === '日' ? ' sun' : '';
      h += '<button class="date' + cls + (i === dayIdx ? ' on' : '') + '" data-day-idx="' + i + '">' +
        '<div class="md">' + esc(m[1] || d.label) + '</div><div class="dw">' + esc(m[2] || '') + '</div>' +
        '<div class="n">' + d.times.length + '枠</div>' +
        (prefId() ? '<div class="np">' + (d.times.filter(hasPref).length ? '● ' + d.times.filter(hasPref).length : '&nbsp;') + '</div>' : '') + '</button>';
    });
    h += '</div><div class="hint">← 横にスクロールして日付を選べます →</div>';
    // ② 選んだ日の時間を 朝・昼・夜 に分けて表示
    const d = vs[dayIdx];
    const bands = BANDS.filter(([k]) => bandOn[k]).map(([, nm, r, f, to]) => [nm + '（' + r + '）', f, to]);
    if (prefId()) h += '<div class="legend"><span class="dot">●</span> ＝ ' + esc(gymName(prefId())) + 'で受けられる時間（おすすめ）</div>';
    h += '<div class="day"><div class="label">' + esc(d.label) + ' の空き</div>';
    bands.forEach(([name, from, to]) => {
      const ts = d.times.filter((t) => { const hh = Number(t.label.split(':')[0]); return hh >= from && hh < to; });
      if (!ts.length) return;
      h += '<div class="band"><div class="bt">' + name + '</div><div class="times">';
      ts.forEach((t) => {
        const on = picked && picked.start === t.start;
        const gs = (t.gyms || []).join(',');
        h += '<button class="time' + (on ? ' on' : '') + (hasPref(t) ? ' pref' : '') + '" data-start="' + esc(t.start) + '" data-day="' + esc(d.label) + '" data-label="' + esc(t.label) + '" data-gyms="' + esc(gs) + '">' + esc(t.label) + (hasPref(t) ? '<span class="dot">●</span>' : '') + '</button>';
      });
      h += '</div></div>';
    });
    h += '</div>';
    box.innerHTML = h;
    bindBands(box);

    box.querySelectorAll('[data-day-idx]').forEach((el) => el.addEventListener('click', () => {
      const x = $('dates').scrollLeft;
      dayIdx = Number(el.getAttribute('data-day-idx'));
      window.__dayLabel = null;
      renderSlots();
      $('dates').scrollLeft = x;
    }));
    box.querySelectorAll('[data-start]').forEach((el) => el.addEventListener('click', () => {
      picked = { start: el.getAttribute('data-start'), day: el.getAttribute('data-day'), label: el.getAttribute('data-label'),
        gyms: (el.getAttribute('data-gyms') || '').split(',').filter(Boolean) };
      box.querySelectorAll('[data-start]').forEach((x) => x.classList.toggle('on', x === el));
      // その時間に空いている場所が1つなら自動で決定、複数なら場所を選んでもらう
      // 優先ジムが空いていれば最初から選んでおく（変えたい人だけ押し直す）
      gymId = picked.gyms.length === 1 ? picked.gyms[0] : (prefId() && picked.gyms.indexOf(prefId()) >= 0 ? prefId() : null);
      renderBar();
      $('bar').classList.add('show');
    }));
  }

  function bindBands(box) {
    box.querySelectorAll('[data-band]').forEach((el) => el.addEventListener('click', () => {
      const k = el.getAttribute('data-band');
      const next = Object.assign({}, bandOn, { [k]: !bandOn[k] });
      if (!next.am && !next.noon && !next.pm) return; // 全部は外せない
      bandOn = next;
      try { localStorage.setItem('sanpon_bands', JSON.stringify(bandOn)); } catch (e) {}
      // 選んでいた時間がしぼり込みで消えたら選び直してもらう
      if (picked && !inBands({ label: picked.label })) { picked = null; gymId = null; hideBar(); }
      const x = $('dates') ? $('dates').scrollLeft : 0;
      renderSlots();
      if ($('dates')) $('dates').scrollLeft = x;
    }));
  }

  function hideBar() { $('bar').classList.remove('show'); }

  // 複数ジムの空き枠を1つにまとめる（時間ごとに「どのジムなら空いているか」を持たせる）
  function mergeSlots(list) {
    const days = {}, order = [];
    list.forEach(([id, ds]) => ds.forEach((d) => {
      if (!days[d.label]) { days[d.label] = { label: d.label, times: {}, first: d.times.length ? d.times[0].start : '' }; order.push(d.label); }
      d.times.forEach((t) => {
        const x = days[d.label].times[t.start] || (days[d.label].times[t.start] = { start: t.start, label: t.label, gyms: [] });
        x.gyms.push(id);
      });
    }));
    return order.map((k) => days[k])
      .map((d) => ({ label: d.label, times: Object.values(d.times).sort((a, b) => a.start < b.start ? -1 : 1) }))
      .filter((d) => d.times.length)
      .sort((a, b) => a.times[0].start < b.times[0].start ? -1 : 1);
  }

  // 下のバー：選んだ日時と、場所が複数あるときは場所ボタン
  function renderBar() {
    if (!picked) return;
    let place = $('placePick');
    if (!place) {
      place = document.createElement('div'); place.id = 'placePick'; place.className = 'gyms'; place.style.margin = '0 0 10px';
      $('reqBtn').parentNode.insertBefore(place, $('reqBtn'));
    }
    const multi = picked.gyms.length > 1;
    $('selText').textContent = picked.day + ' ' + picked.label + '〜' + (gymId ? '（' + gymName(gymId) + '）' : '｜場所を選んでください');
    place.innerHTML = multi ? picked.gyms.map((id) =>
      '<button class="gym' + (id === gymId ? ' on' : '') + '" data-place="' + esc(id) + '">' + esc(gymName(id)) + (view.gyms.some((x) => x.id === id && x.preferred) ? '<span class="tag">優先</span>' : '') + '</button>').join('') : '';
    place.querySelectorAll('[data-place]').forEach((b) => b.addEventListener('click', () => { gymId = b.getAttribute('data-place'); renderBar(); }));
    $('reqBtn').disabled = !gymId;
  }

  $('reqBtn').addEventListener('click', async () => {
    if (!picked || !gymId || busy) return;
    busy = true; $('reqBtn').disabled = true; $('reqBtn').textContent = '送信中…（数秒かかります）';
    try {
      const bookedStart = new Date(picked.start).getTime();
      const r = await call('apiRequest', TOKEN, gymId, picked.start);
      // 次の予約に備えて、裏で予約状況を取り直しておく。空き枠は手元の一覧から今入れた時間の前後だけ外す
      const viewP = call('apiCustomerView', TOKEN); viewP.catch(() => {});
      const len = ((view && view.sessionMin) || 60) * 60000, buf = 60 * 60000;
      Object.keys(slotsByGym).forEach((id) => {
        slotsByGym[id] = (slotsByGym[id] || []).map((d) => Object.assign({}, d, { times: d.times.filter((t) => {
          const ts = new Date(t.start).getTime(); return !(ts < bookedStart + len + buf && ts + len > bookedStart - buf); }) }))
          .filter((d) => d.times.length);
      });
      hideBar();
      $('app').innerHTML = '<div class="done"><div class="check">✓</div>' +
        '<div class="hello">仮予約を受け付けました</div>' +
        '<div class="card" style="text-align:left"><b>' + esc(r.date) + '</b> ' + esc(r.time) + '<div class="muted">' + esc(r.gym) + '</div></div>' +
        '<p class="muted">ジムの空きを確認して、トレーナーが確定します。確定したらSlackでお知らせします。</p>' +
        '<button class="btn ghost" id="backBtn">予約画面に戻る</button></div>';
      $('backBtn').addEventListener('click', () => load({ viewP }));
    } catch (e) {
      hideBar();
      picked = null;
      slotsByGym = {}; slotsAllP = null; // 埋まっていた枠があるので最新を取り直す
      await loadSlots();
      const box = $('slots');
      if (box) box.insertAdjacentHTML('afterbegin', '<div class="err">' + esc(e) + '</div>');
    } finally {
      busy = false; $('reqBtn').disabled = false; $('reqBtn').textContent = 'この日時で仮予約する';
      if (picked) renderBar();
    }
  });

  load();
</script>
</body>
</html>
